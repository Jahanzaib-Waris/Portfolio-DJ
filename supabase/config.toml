
[functions.apollo-proxy]
enabled = true
verify_jwt = true
import_map = "./functions/apollo-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/apollo-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/apollo-proxy/*.html" ]

[functions.ai-proxy]
enabled = true
verify_jwt = true
import_map = "./functions/ai-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ai-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ai-proxy/*.html" ]

[functions.quote-notify]
enabled = true
# Called by a database trigger, not a signed-in user; authenticated by the x-webhook-secret header instead.
verify_jwt = false
import_map = "./functions/quote-notify/deno.json"
entrypoint = "./functions/quote-notify/index.ts"
